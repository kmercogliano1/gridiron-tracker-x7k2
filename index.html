<!DOCTYPE html>
  <html lang="en">
  <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Panthers">
  <meta name="theme-color" content="#1c1a16">
  <title>Panthers Training Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
        --gold: #c8912f; --green: #3c6e57; --danger: #a3433f;
        --ink: #1c1a16; --paper: #f3efe6; --card: #fbf9f4;
        --muted: #7a7468; --muted2: #9c9384; --line: #ddd6c7;
    }
  html, body { margin: 0; padding: 0; background: var(--paper); }
  body { font-family: 'Oswald', 'Arial Narrow', sans-serif; color: var(--ink); }
  .app { max-width: 480px; margin: 0 auto; min-height: 100vh; background: var(--paper); padding-bottom: 30px; }
  .body-font { font-family: 'Inter', sans-serif; }
  .header { background: var(--ink); color: var(--paper); padding: max(18px, env(safe-area-inset-top)) 20px 14px; }
  .eyebrow { font-size: 12px; letter-spacing: 2px; color: #b8b0a0; text-transform: uppercase; }
    .title { font-size: 22px; font-weight: 600; letter-spacing: 0.5px; margin-top: 2px; }
  .strip { display: flex; align-items: center; padding: 10px 12px 4px; gap: 4px; }
  .strip-day { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 2px; border-radius: 8px; cursor: pointer; border: none; background: transparent; font-family: 'Oswald', sans-serif; }
  .strip-day.active { background: var(--ink); color: var(--paper); }
  .strip-day .dow { font-size: 10px; color: var(--muted); text-transform: uppercase; font-family: 'Inter', sans-serif; }
  .strip-day.active .dow { color: #b8b0a0; }
    .strip-day .num { font-size: 15px; font-weight: 600; }
  .dot { width: 6px; height: 6px; border-radius: 50%; }
  .datebar { display: flex; align-items: center; justify-content: space-between; padding: 8px 20px 14px; border-bottom: 1px solid var(--line); }
  .navbtn { background: none; border: none; padding: 6px; cursor: pointer; color: var(--ink); }
  .datebar-center { text-align: center; }
  .datebar-sub { font-size: 13px; color: var(--muted); font-family: 'Inter', sans-serif; }
  .datebar-tag { font-size: 15px; font-weight: 600; }
  .content { padding: 16px 20px 22px; }
  section { margin-bottom: 22px; }
  .sec-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .sec-label { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; color: var(--muted); font-family: 'Inter', sans-serif; }
  .sec-count { font-size: 12px; color: var(--muted); font-family: 'Inter', sans-serif; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 4px 14px; }
  .row-btn { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; background: none; border: none; border-top: 1px solid var(--line); padding: 10px 0; cursor: pointer; font-family: inherit; color: inherit; }
  .row-btn:first-child { border-top: none; }
  .chk { width: 22px; height: 22px; border-radius: 5px; border: 2px solid var(--line); display: flex; align-items: center; justify-content: center; flex-shrink: 0; background: var(--card); transition: background 0.15s, border-color 0.15s; }
  .chk.on { background: var(--green); border-color: var(--green); }
  .lift-name, .meal-name, .rec-name { font-size: 14px; font-family: 'Inter', sans-serif; }
  .rec-detail { font-size: 11px; color: var(--muted); font-family: 'Inter', sans-serif; margin-top: 2px; }
  .meal-target { font-size: 12px; color: var(--muted); font-family: 'Inter', sans-serif; }
  .struck { text-decoration: line-through; color: var(--muted); }
  .weight-row { display: flex; gap: 8px; align-items: center; }
  .weight-row input { flex: 1; padding: 9px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); font-size: 15px; font-family: 'Inter', sans-serif; }
  .weight-row button { padding: 9px 16px; border-radius: 8px; border: none; background: var(--ink); color: var(--paper); font-size: 14px; font-weight: 600; cursor: pointer; font-family: 'Inter', sans-serif; }
  .weight-history { display: flex; gap: 6px; margin-top: 10px; overflow-x: auto; }
  .weight-chip { background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; font-size: 11px; color: var(--muted); white-space: nowrap; font-family: 'Inter', sans-serif; }
  .weight-chip b { color: var(--ink); font-weight: 600; }
  .progress-track { height: 6px; background: var(--line); border-radius: 3px; margin-bottom: 10px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--green); transition: width 0.2s; }
  .savebar { text-align: center; margin-top: 18px; font-size: 11px; color: var(--muted2); font-family: 'Inter', sans-serif; min-height: 14px; }
  svg.icon { width: 16px; height: 16px; stroke: var(--muted); }
</style>
  </head>
  <body>
  <div class="app" id="app"></div>

  <script>
const WEEKDAY_DEFAULT = {
    0: { label: "Sun", type: "WALK", tag: "Rest day" },
    1: { label: "Mon", type: "LIFT_HEAVY", tag: "Lift — heavy" },
    2: { label: "Tue", type: "PRACTICE", tag: "Pads practice" },
    3: { label: "Wed", type: "LIFT_LIGHT", tag: "Lift — light" },
    4: { label: "Thu", type: "PRACTICE", tag: "Pads practice" },
    5: { label: "Fri", type: "WALK", tag: "Walkthrough" },
    6: { label: "Sat", type: "WALK", tag: "Walkthrough" },
};
    const GAMES = {
        "2026-08-30": "Walpole",
        "2026-09-06": "Weymouth",
        "2026-09-12": "Dover-Sherborn",
        "2026-09-19": "Taunton",
        "2026-09-27": "Lincoln-Sudbury",
        "2026-10-04": "Milton",
        "2026-10-11": "Attleboro",
        "2026-10-18": "Needham",
    };
    function getPlan(d) {
        const k = dateKey(d);
        const base = WEEKDAY_DEFAULT[d.getDay()];
        if (GAMES[k]) return { label: base.label, type: "GAME", tag: "Game vs " + GAMES[k] };
        const yest = new Date(d); yest.setDate(d.getDate() - 1);
        if (GAMES[dateKey(yest)]) return { label: base.label, type: "WALK", tag: "Recovery day" };
        return base;
    }
const TYPE_COLOR = { GAME: "var(--danger)", LIFT_HEAVY: "var(--gold)", LIFT_LIGHT: "var(--gold)", PRACTICE: "var(--green)", WALK: "var(--muted2)" };
const LIFTS = {
  LIFT_HEAVY: ["Goblet / box squat","Romanian deadlift","DB bench press","Chest-supported row","Walking lunge","Plank + side plank","Neck / trap work"],
  LIFT_LIGHT: ["Front squat / split squat","Single-leg RDL","Incline DB press","Lat pulldown / pull-ups","Step-ups","Dead bug / Pallof press","Neck / trap work"],
};
const MEALS_BY_TYPE = {
    GAME: [
      { key: "breakfast", label: "Breakfast", target: 25 },
      { key: "snack1", label: "Mid-morning snack", target: 15 },
      { key: "lunch", label: "Lunch", target: 30 },
      { key: "preGame", label: "Pre-game meal", label2: "(1-2 hrs before)", target: 15 },
      { key: "postGame", label: "Post-game recovery", label2: "(within 45-60 min)", target: 20 },
      { key: "dinner", label: "Dinner", target: 30 },
      { key: "evening", label: "Evening snack", target: 15 },
        ],
    PRACTICE: [
      { key: "breakfast", label: "Breakfast", target: 25 },
      { key: "snack1", label: "Mid-morning snack", target: 15 },
      { key: "lunch", label: "Lunch", target: 30 },
      { key: "preSnack", label: "Pre-practice snack", target: 10 },
      { key: "postSnack", label: "Post-practice recovery", label2: "(within 45-60 min)", target: 20 },
      { key: "dinner", label: "Dinner", target: 30 },
      { key: "evening", label: "Evening snack", target: 15 },
        ],
    LIFT_HEAVY: [
      { key: "breakfast", label: "Breakfast", target: 25 },
      { key: "snack1", label: "Mid-morning snack", target: 15 },
      { key: "lunch", label: "Lunch", target: 30 },
      { key: "postWorkout", label: "Post-workout recovery", label2: "(within 45-60 min)", target: 20 },
      { key: "dinner", label: "Dinner", target: 30 },
      { key: "evening", label: "Evening snack", target: 15 },
        ],
    LIFT_LIGHT: [
      { key: "breakfast", label: "Breakfast", target: 25 },
      { key: "snack1", label: "Mid-morning snack", target: 15 },
      { key: "lunch", label: "Lunch", target: 30 },
      { key: "postWorkout", label: "Post-workout recovery", label2: "(within 45-60 min)", target: 20 },
      { key: "dinner", label: "Dinner", target: 30 },
      { key: "evening", label: "Evening snack", target: 15 },
        ],
    WALK: [
      { key: "breakfast", label: "Breakfast", target: 25 },
      { key: "snack1", label: "Mid-morning snack", target: 15 },
      { key: "lunch", label: "Lunch", target: 30 },
      { key: "dinner", label: "Dinner", target: 30 },
      { key: "evening", label: "Evening snack", target: 15 },
        ],
};
const RECOVERY = {
    GAME: [
      {key:"gunQuadsGlutes",label:"Gun — quads & glutes",detail:"Round head, 45 sec each side"},
      {key:"gunHams",label:"Gun — hamstrings",detail:"Flat head, 45 sec each side"},
      {key:"gunCalvesTraps",label:"Gun — calves & traps",detail:"Fork head, 30 sec each side (avoid Achilles)"},
      {key:"gunNeck",label:"Gun — neck (if tight)",detail:"Cushion head, 20 sec each side"},
      {key:"roller",label:"Foam roller",detail:"5-10 min, full body"},
      {key:"iceBath",label:"Ice bath",detail:"8-10 min, that night"},
        ],
    PRACTICE: [
      {key:"gunQuadsHams",label:"Gun — quads & hamstrings",detail:"Flat head, 45 sec each"},
      {key:"gunCalves",label:"Gun — calves",detail:"Fork head, 30 sec each (avoid Achilles)"},
      {key:"gunGlutes",label:"Gun — glutes",detail:"Round head, 30 sec each"},
      {key:"roller",label:"Foam roller",detail:"5-10 min"},
      {key:"iceBathThu",label:"Ice bath (Thu only)",detail:"8-10 min, evening"},
        ],
    LIFT_HEAVY: [
      {key:"gunQuads",label:"Gun — quads",detail:"Round head, 45 sec each leg"},
      {key:"gunHamsGlutes",label:"Gun — hamstrings & glutes",detail:"Flat head, 45 sec each side"},
      {key:"gunTraps",label:"Gun — upper traps",detail:"Fork head, 30 sec each side"},
      {key:"roller",label:"Foam roller",detail:"5-10 min, evening"},
        ],
    LIFT_LIGHT: [
      {key:"gunQuadsLats",label:"Gun — quads & lats",detail:"Round head, 45 sec each side"},
      {key:"gunForearmsTraps",label:"Gun — forearms & traps",detail:"Fork head, 30 sec each side"},
      {key:"gunGlutes",label:"Gun — glutes",detail:"Flat head, 30 sec each side"},
      {key:"roller",label:"Foam roller",detail:"5-10 min, evening"},
        ],
    WALK: [
      {key:"gunLight",label:"Gun — light, whatever's tight",detail:"Cushion head, 5 min total"},
      {key:"roller",label:"Foam roller",detail:"Light, 5 min"},
        ],
};

let state = { date: new Date() };

function dateKey(d) { return d.toISOString().slice(0,10); }
function fmtDate(d) { return d.toLocaleDateString(undefined, { weekday: "long", month: "short", day: "numeric" }); }
function loadEntry(key) {
  try { const raw = localStorage.getItem("day:" + key); return raw ? JSON.parse(raw) : { lifts:{}, meals:{}, recovery:{}, weight:null }; }
  catch(e) { return { lifts:{}, meals:{}, recovery:{}, weight:null }; }
}
function saveEntry(key, entry) {
  try { localStorage.setItem("day:" + key, JSON.stringify(entry)); return true; } catch(e) { return false; }
}
function loadWeightLog() {
  try { const raw = localStorage.getItem("weight-log"); return raw ? JSON.parse(raw) : []; } catch(e) { return []; }
}
function saveWeightLog(log) {
  try { localStorage.setItem("weight-log", JSON.stringify(log)); } catch(e) {}
}
function checkIcon() { return '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>'; }
function chevIcon(dir) { return dir === "left" ? '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>' : '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>'; }

function render() {
  const key = dateKey(state.date);
  const dow = state.date.getDay();
    const plan = getPlan(state.date);
  const entry = loadEntry(key);
  const weightHistory = loadWeightLog();
  const liftList = LIFTS[plan.type] || null;
  const recoveryList = RECOVERY[plan.type] || [];
    const meals = MEALS_BY_TYPE[plan.type] || MEALS_BY_TYPE.WALK;
      const proteinTarget = meals.reduce((s,m) => s + m.target, 0);
      const proteinDone = meals.filter(m => entry.meals[m.key]).reduce((s,m) => s + m.target, 0);
  const liftDone = liftList ? liftList.filter(n => entry.lifts[n]).length : 0;
  const recoveryDone = recoveryList.filter(r => entry.recovery[r.key]).length;
  const isToday = key === dateKey(new Date());
  const recentWeights = weightHistory.slice(-6);

  let stripHtml = "";
  for (let off = -2; off <= 4; off++) {
    const d = new Date(); d.setDate(d.getDate() + off);
          const dp = getPlan(d);
    const active = dateKey(d) === key;
    stripHtml += `<button class="strip-day ${active?'active':''}" data-offset="${off}">
      <span class="dow">${dp.label}</span><span class="num">${d.getDate()}</span>
      <span class="dot" style="background:${TYPE_COLOR[dp.type]}"></span></button>`;
}

  let liftHtml = "";
  if (liftList) {
    liftHtml = `<section><div class="sec-head"><span class="sec-label">Lift</span><span class="sec-count">${liftDone}/${liftList.length}</span></div>
      <div class="card">${liftList.map(name => `
        <button class="row-btn" data-lift="${name}">
          <span class="chk ${entry.lifts[name]?'on':''}">${entry.lifts[name]?checkIcon():''}</span>
          <span class="lift-name ${entry.lifts[name]?'struck':''}">${name}</span>
        </button>`).join("")}</div></section>`;
}

  const mealHtml = `<section><div class="sec-head"><span class="sec-label">Meals + protein</span>
      <span class="sec-count" style="color:${proteinDone>=115?'var(--green)':'var(--muted)'}">${proteinDone}g / ${proteinTarget}g</span></div>
      <div class="progress-track"><div class="progress-fill" style="width:${Math.min(100,(proteinDone/proteinTarget)*100)}%"></div></div>
      <div class="card">${meals.map(m => `
        <button class="row-btn" data-meal="${m.key}">
          <span class="chk ${entry.meals[m.key]?'on':''}">${entry.meals[m.key]?checkIcon():''}</span>
          <span class="meal-name ${entry.meals[m.key]?'struck':''}" style="flex:1">${m.label}${m.label2?` <span style="color:var(--muted);font-size:12px">${m.label2}</span>`:''}</span>
          <span class="meal-target">~${m.target}g</span>
        </button>`).join("")}</div></section>`;

  const recHtml = `<section><div class="sec-head"><span class="sec-label">Recovery</span><span class="sec-count">${recoveryDone}/${recoveryList.length}</span></div>
      <div class="card">${recoveryList.map(r => `
        <button class="row-btn" data-rec="${r.key}">
          <span class="chk ${entry.recovery[r.key]?'on':''}">${entry.recovery[r.key]?checkIcon():''}</span>
          <div><div class="rec-name ${entry.recovery[r.key]?'struck':''}">${r.label}</div><div class="rec-detail">${r.detail}</div></div>
        </button>`).join("")}</div></section>`;

  document.getElementById("app").innerHTML = `
    <div class="header"><div class="eyebrow">G8 Franklin Panthers</div><div class="title">Training tracker</div></div>
    <div class="strip">${stripHtml}</div>
    <div class="datebar">
      <button class="navbtn" id="prevDay">${chevIcon("left")}</button>
      <div class="datebar-center"><div class="datebar-sub">${fmtDate(state.date)}${isToday?' · Today':''}</div>
        <div class="datebar-tag" style="color:${TYPE_COLOR[plan.type]}">${plan.tag}</div></div>
      <button class="navbtn" id="nextDay">${chevIcon("right")}</button>
    </div>
    <div class="content">
      <section>
        <div class="sec-head"><span class="sec-label">Body weight</span></div>
        <div class="weight-row">
          <input type="number" inputmode="decimal" id="weightInput" placeholder="${entry.weight?entry.weight:'lbs'}">
          <button id="logWeight">Log</button>
        </div>
        ${recentWeights.length ? `<div class="weight-history">${recentWeights.map(w => `<div class="weight-chip">${w.date.slice(5)}: <b>${w.value}</b></div>`).join("")}</div>` : ""}
      </section>
      ${liftHtml}
      ${mealHtml}
      ${recHtml}
      <div class="savebar" id="saveMsg"></div>
    </div>`;

  document.querySelectorAll("[data-offset]").forEach(btn => btn.onclick = () => {
    const off = parseInt(btn.dataset.offset);
    const d = new Date(); d.setDate(d.getDate() + off); state.date = d; render();
});
  document.getElementById("prevDay").onclick = () => { const d = new Date(state.date); d.setDate(d.getDate()-1); state.date = d; render(); };
  document.getElementById("nextDay").onclick = () => { const d = new Date(state.date); d.setDate(d.getDate()+1); state.date = d; render(); };
  document.querySelectorAll("[data-lift]").forEach(btn => btn.onclick = () => {
    const e = loadEntry(key); e.lifts[btn.dataset.lift] = !e.lifts[btn.dataset.lift];
    saveEntry(key, e); render(); flashSaved();
});
  document.querySelectorAll("[data-meal]").forEach(btn => btn.onclick = () => {
    const e = loadEntry(key); e.meals[btn.dataset.meal] = !e.meals[btn.dataset.meal];
    saveEntry(key, e); render(); flashSaved();
});
  document.querySelectorAll("[data-rec]").forEach(btn => btn.onclick = () => {
    const e = loadEntry(key); e.recovery[btn.dataset.rec] = !e.recovery[btn.dataset.rec];
    saveEntry(key, e); render(); flashSaved();
});
  document.getElementById("logWeight").onclick = () => {
    const val = parseFloat(document.getElementById("weightInput").value);
    if (!val || val <= 0) return;
    const e = loadEntry(key); e.weight = val; saveEntry(key, e);
    const log = loadWeightLog().filter(w => w.date !== key);
    log.push({ date: key, value: val }); log.sort((a,b) => a.date.localeCompare(b.date));
    saveWeightLog(log); render(); flashSaved();
};
}
function flashSaved() {
  const el = document.getElementById("saveMsg");
  if (el) { el.textContent = "Saved"; setTimeout(() => { if (el) el.textContent = ""; }, 1200); }
}
render();
</script>
</body>
</html>
